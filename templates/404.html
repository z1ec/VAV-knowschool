{% extends "base.html" %}

{% block title %}Страница не найдена — Хочу всё знать{% endblock %}

{% block content %}
  <main class="container">
    <section class="error-page">
      <div class="error-page__code">404</div>
      <h1 class="error-page__title">Такой страницы не существует</h1>
      <p class="error-page__text">Возможно, ссылка устарела или страница была перемещена. Проверьте адрес или
        вернитесь на главную.</p>
      <div class="error-page__actions">
        <a href="{{ url_for('index') }}" class="btn hero__cta">На главную</a>
        <a href="{{ url_for('index') }}#zayavka" class="hero__link">Связаться с нами →</a>
      </div>
    </section>
  </main>
{% endblock %}
